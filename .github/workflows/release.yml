# Author: jaswtao · Date: 2026-10-20
name: Draft Windows release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.8.1
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install 1.95.0 --profile minimal --no-self-update
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Validate release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/check-release.py --tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $scanner = & ./scripts/install-gitleaks.ps1
          ./scripts/release-check.ps1 -Gitleaks $scanner
      - name: Build release artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/prepare-release.ps1 -Tag $env:RELEASE_TAG
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: release/
          if-no-files-found: error
          retention-days: 14
  draft:
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release
          path: release
      - name: Create draft prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $notes = @'
          First public preview for Windows x64. This installer is unsigned.
          Verify SHA256SUMS.txt before installing.
          Third-party notices and matching MPL sources are attached.
          Native installation and desktop acceptance are required before publication.
          See doc/release-checklist.md in the matching source archive.
          '@
          $body = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -LiteralPath $body -Value $notes -Encoding utf8
          $assets = @(Get-ChildItem -Path 'release/*/*' -File | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG --verify-tag --draft --prerelease --title "Orbyte $env:RELEASE_TAG" --notes-file $body @assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
