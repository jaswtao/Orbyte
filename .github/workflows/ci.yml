# Author: jaswtao · Date: 2026-10-20
name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      RUST_TEST_THREADS: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.8.1
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install 1.95.0 --profile minimal --no-self-update
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Test release packaging guards
        run: python -m unittest discover -s scripts/tests -v
      - name: Audit, scan, test and build
        run: |
          $scanner = & ./scripts/install-gitleaks.ps1
          ./scripts/release-check.ps1 -Gitleaks $scanner
      - name: Scan commit history
        run: |
          $scanner = Join-Path $env:TEMP 'orbyte-gitleaks-8.30.1/gitleaks.exe'
          & $scanner git . --redact --no-banner
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  minimum-rust:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.8.1
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install 1.90.0 --profile minimal --no-self-update
      - run: cargo +1.90.0 check --workspace --all-targets --locked
